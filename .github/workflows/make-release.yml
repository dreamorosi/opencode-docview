name: Make Release

# RELEASE PROCESS
#
# 1. Run make-version.yml and merge the PR it opens.
# 2. Run this workflow from main. It:
#    - runs the code quality checks
#    - publishes the package to npm with trusted publishing (OIDC), which adds a provenance attestation
#    - tags the release commit (v1.2.3) and creates a GitHub release from the CHANGELOG.md entry
#
# npm trusted publishing must point at this workflow file (make-release.yml) and the "Release" environment.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: on-release-publish

jobs:
  run-unit-tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-code-quality.yml

  publish-npm:
    needs: [run-unit-tests]
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    environment: Release
    runs-on: ubuntu-latest
    outputs:
      RELEASE_VERSION: ${{ steps.set-release-version.outputs.RELEASE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # no dependency cache in release builds
      - name: Set release version
        id: set-release-version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$(npm view "opencode-docview@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::error::opencode-docview@$VERSION is already on npm. Run make-version.yml first."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Publish to npm
        # npm tries trusted publishing (OIDC) first. NPM_TOKEN is only a fallback for the first
        # publish, before the package exists and trusted publishing can be configured on npmjs.com.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  create-release:
    needs: [publish-npm]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-npm.outputs.RELEASE_VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          # Release notes are this version's CHANGELOG.md section, without its heading.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ -s notes.md ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
          fi
