version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # @opentui/solid pins an exact solid-js, and babel-preset-solid must match it, so they move together.
      opentui:
        patterns:
          - "@opentui/*"
          - "solid-js"
          - "babel-preset-solid"
      opencode:
        patterns:
          - "@opencode/*"
      dev-tools:
        dependency-type: development
        exclude-patterns:
          - "@opentui/*"
          - "@opencode/*"
          - "solid-js"
          - "babel-preset-solid"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
