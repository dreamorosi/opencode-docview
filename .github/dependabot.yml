version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      opencode:
        patterns:
          - "@opencode/*"
      dev-tools:
        dependency-type: development
        exclude-patterns:
          - "@opencode/*"
    ignore:
      # These must match what the OpenCode release bundles (@opentui/solid pins an exact solid-js,
      # and babel-preset-solid must match it), so update them by hand alongside @opencode/plugin.
      - dependency-name: "@opentui/*"
      - dependency-name: "solid-js"
      - dependency-name: "babel-preset-solid"
      # babel-preset-solid only supports Babel 7.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
